app = "prankcaller-backend"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      grace_period = "20s"
      interval = "30s"
      method = "GET"
      path = "/health"
      timeout = "5s"
