<!doctype html>
<html lang="$lang" class="$page_class">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$name · $eyebrow</title>
<style>
  :root { color-scheme: light dark; --page:#fafbf9; --ink:#192b25; --muted:#53645d; --line:#d8dfda; --accent:#175f4a; --button:#fff; }
  @media (prefers-color-scheme:dark) { :root { --page:#15211b; --ink:#f0f5f1; --muted:#b5c7bb; --line:#43594b; --accent:#96d9b4; --button:#102319; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:64px 24px; background:var(--page); color:var(--ink); font:400 1rem/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { max-width:520px; margin:0 auto; }
  .eyebrow { margin:0 0 20px; font-size:.7rem; letter-spacing:.12em; color:var(--accent); }
  h1 { margin:0; font-size:clamp(1.7rem,5vw,2.4rem); line-height:1.2; letter-spacing:-.035em; }
  .subtitle { margin:16px 0 28px; color:var(--muted); }
  label { display:block; margin-bottom:6px; font-size:14px; color:var(--muted); }
  select { width:100%; min-height:48px; margin-bottom:16px; padding:10px; font:inherit; color:var(--ink); background:var(--page); border:1px solid var(--line); border-radius:8px; }
  select:focus-visible { outline:3px solid #b17a23; outline-offset:3px; }
  button { font:inherit; cursor:pointer; }
  button:focus-visible, summary:focus-visible { outline:3px solid #b17a23; outline-offset:4px; }
  #btn { min-height:52px; width:100%; border:0; border-radius:8px; padding:12px 24px; background:var(--accent); color:var(--button); font-weight:600; }
  #btn.end { background:#a93235; color:#fff; }
  #btn:disabled { opacity:.65; cursor:wait; }
  .call-status { margin:14px 0 0; text-align:center; font-size:.9rem; }
  .help { margin:8px 0 32px; text-align:center; color:var(--muted); font-size:.8rem; }
  details { border-top:1px solid var(--line); padding-top:20px; }
  summary { cursor:pointer; font-size:.95rem; padding:4px 0; }
  h2 { margin:24px 0 10px; font-size:1rem; }
  dl { margin:0; }
  .info-row { display:flex; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid var(--line); }
  dt,dd { margin:0; overflow-wrap:anywhere; }
  dd { text-align:right; }
  small,.info-note { color:var(--muted); font-size:.8rem; }
  small { display:block; }
  .embed body { padding:24px 20px; }
  .embed h1 { font-size:1.5rem; }
  @media(max-width:480px) { body { padding:40px 22px; } }
</style>
</head>
<body>
<main class="app">
  <header>
    <p class="eyebrow">$eyebrow</p>
    <h1>$name</h1>
    <p class="subtitle">$subtitle</p>
  </header>
  <section id="call-panel" data-state="ready">
    <label for="voice">$voice_label</label>
    <select id="voice" name="voice"><option value="eleven_brian">Brian</option><option value="eleven_sarah">Sarah</option><option value="eleven_jessica">Jessica</option><option value="eleven_george">George</option></select>
    <button id="btn" type="button" data-call="$call" data-hang-up="$hang_up">$call</button>
    <p class="call-status" id="status" role="status">$s_ready</p>
    <p class="help">$note</p>
  </section>
  <details>
    <summary>$info_title</summary>
    <p class="info-note">$info_note</p>
    <h2>$services_title</h2>
    <dl>$service_rows</dl>
    <h2>$hours_title</h2>
    <p class="info-note">$timezone</p>
    <dl>$hours_rows</dl>
  </details>
</main>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
const LK = window.LivekitClient;
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const panel = document.getElementById("call-panel");
let room = null;

function setStatus(message, state) {
  statusEl.textContent = message;
  panel.dataset.state = state;
}
function idle() {
  room = null;
  document.getElementById("voice").disabled = false;
  btn.textContent = btn.dataset.call;
  btn.className = "";
  btn.disabled = false;
}
async function start() {
  btn.disabled = true;
  const voice = document.getElementById("voice");
  voice.disabled = true;
  setStatus("$s_connecting", "connecting");
  let activeRoom = null;
  let microphone = null;
  const media = new Set();
  function cleanup() { if (microphone) { microphone.stop(); microphone = null; } for (const element of media) element.remove(); media.clear(); }
  try {
    // Ask before creating a paid session; keep the track for publication.
    microphone = await LK.createLocalAudioTrack({ echoCancellation: true, noiseSuppression: true });
    const sessionPath = window.location.pathname.replace(/\/$$/, "") + "/session";
    const response = await fetch(sessionPath, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({voice:voice.value}), signal: AbortSignal.timeout(15000) });
    if (!response.ok) {
      cleanup();
      setStatus(response.status === 429 ? "$s_busy" : "$s_error", "error");
      idle();
      return;
    }
    const { url, token } = await response.json();
    activeRoom = new LK.Room();
    room = activeRoom;
    activeRoom.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "audio") {
        const element = track.attach();
        media.add(element);
        document.body.appendChild(element);
      }
    });
    activeRoom.on(LK.RoomEvent.TrackUnsubscribed, (track) => {
      for (const element of track.detach()) { element.remove(); media.delete(element); }
    });
    activeRoom.on(LK.RoomEvent.Disconnected, () => {
      cleanup();
      if (room === activeRoom) { setStatus("$s_ended", "ended"); idle(); }
    });
    await activeRoom.connect(url, token);
    await activeRoom.localParticipant.publishTrack(microphone);
    if (room !== activeRoom) return;
    setStatus("$s_live", "live");
    btn.textContent = btn.dataset.hangUp;
    btn.className = "end";
    btn.disabled = false;
  } catch (error) {
    console.error(error);
    if (activeRoom) await activeRoom.disconnect();
    cleanup();
    const microphoneError = error && ["NotAllowedError", "PermissionDeniedError", "NotFoundError"].includes(error.name);
    setStatus(microphoneError ? "$s_mic_error" : "$s_error", "error");
    idle();
  }
}

btn.addEventListener("click", () => room ? room.disconnect() : start());
window.addEventListener("pagehide", () => { if (room) room.disconnect(); });
</script>
</body>
</html>
