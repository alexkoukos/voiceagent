<!doctype html>
<html lang="$lang" class="$page_class">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$name · $transcript_title</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f1f5f1;
    --surface: #ffffff;
    --surface-soft: #f6f8f6;
    --ink: #172b25;
    --muted: #53645d;
    --line: #d4dfd8;
    --accent: #175f4a;
    --accent-ink: #ffffff;
    --agent: #eaf3ee;
    --caller: #f3f5f4;
    --danger: #a93235;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101916;
      --surface: #19251f;
      --surface-soft: #202e27;
      --ink: #f0f5f1;
      --muted: #b5c7bb;
      --line: #43594b;
      --accent: #96d9b4;
      --accent-ink: #102319;
      --agent: #294535;
      --caller: #26352c;
      --danger: #f2a3a3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: clamp(12px, 3vw, 32px);
    background: radial-gradient(circle at top left, #dcebe0, transparent 42%), var(--page);
    color: var(--ink);
    font: 400 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: radial-gradient(circle at top left, #1b3527, transparent 42%), var(--page); }
  }
  .app {
    width: min(100%, 720px);
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 16px 46px rgba(18, 50, 30, .08);
    overflow: hidden;
  }
  .intro { padding: clamp(20px, 4vw, 32px) clamp(20px, 4vw, 36px) 20px; }
  .eyebrow { margin: 0 0 7px; color: var(--accent); font-size: .72rem; font-weight: 750; letter-spacing: .11em; }
  h1 { margin: 0; font-size: clamp(1.45rem, 4vw, 2rem); line-height: 1.2; letter-spacing: -.025em; }
  .subtitle { margin: 8px 0 0; color: var(--muted); }
  .call-panel {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 16px clamp(20px, 4vw, 36px) 20px;
    border-bottom: 1px solid var(--line);
  }
  .call-status { display: flex; align-items: center; gap: 9px; flex: 1 1 220px; min-width: 0; font-weight: 650; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #7e9186; flex: none; }
  .call-panel[data-state="live"] .status-dot { background: #20844e; box-shadow: 0 0 0 4px rgba(32, 132, 78, .15); }
  .call-panel[data-state="connecting"] .status-dot { background: #b47a18; }
  .call-panel[data-state="error"] .status-dot { background: var(--danger); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #d58d28; outline-offset: 3px; }
  #btn {
    min-height: 48px;
    padding: 10px 20px;
    border: 0;
    border-radius: 12px;
    color: var(--accent-ink);
    background: var(--accent);
    font-weight: 700;
  }
  #btn.end { background: #a93235; color: #fff; }
  #btn:disabled { opacity: .65; cursor: wait; }
  .voice { flex: 1 0 100%; display: flex; align-items: center; gap: 10px; }
  .voice-label { color: var(--muted); font-size: .84rem; }
  .seg { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); }
  .seg label { position: relative; }
  .seg input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
  .seg span { display: block; padding: 7px 14px; border-radius: 9px; color: var(--muted); font-size: .86rem; font-weight: 650; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .seg input:focus-visible + span { outline: 3px solid #d58d28; outline-offset: 2px; }
  .seg input:disabled { cursor: default; }
  .seg input:disabled:not(:checked) + span { opacity: .5; }
  .help { flex: 1 0 100%; margin: 0; color: var(--muted); font-size: .84rem; }
  .transcript { padding: 22px clamp(20px, 4vw, 36px) 28px; }
  .transcript-header { margin-bottom: 14px; }
  h2 { margin: 0; font-size: 1.12rem; line-height: 1.3; }
  .transcript-hint { margin: 5px 0 0; color: var(--muted); font-size: .85rem; }
  .transcript-frame { border: 1px solid var(--line); border-radius: 16px; background: var(--surface-soft); overflow: hidden; }
  #empty { padding: clamp(28px, 6vw, 52px) 20px; text-align: center; color: var(--muted); }
  #empty::before { content: "•••"; display: block; margin-bottom: 8px; color: var(--accent); letter-spacing: .25em; }
  #log { margin: 0; padding: 18px; list-style: none; max-height: min(46vh, 400px); overflow-y: auto; overscroll-behavior: contain; }
  #log[hidden], #empty[hidden], #jump[hidden] { display: none; }
  .turn + .turn { margin-top: 16px; }
  .turn-meta { display: flex; align-items: baseline; gap: 10px; margin: 0 0 5px 3px; color: var(--muted); font-size: .75rem; }
  .turn-speaker { color: var(--ink); font-weight: 750; }
  .turn--agent .turn-speaker { color: var(--accent); }
  .turn-text { width: fit-content; max-width: min(100%, 62ch); margin: 0; padding: 11px 14px; border: 1px solid var(--line);
    border-radius: 4px 15px 15px 15px; background: var(--caller); line-height: 1.58; white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn--agent .turn-text { border-color: transparent; border-radius: 15px 4px 15px 15px; background: var(--agent); }
  .turn[data-final="false"] .turn-text { opacity: .7; }
  #jump { display: block; width: 100%; padding: 10px; border: 0; border-top: 1px solid var(--line); background: var(--surface);
    color: var(--accent); font-size: .84rem; font-weight: 700; }
  @media (max-width: 480px) {
    .app { border-radius: 17px; }
    .call-panel { align-items: stretch; }
    .call-status { flex-basis: 100%; }
    #btn { width: 100%; }
    #log { max-height: 38vh; padding: 14px; }
  }
  .embed body { padding: 0; background: var(--surface); }
  .embed .app { border: 0; border-radius: 0; box-shadow: none; }
  .embed .intro { padding: 17px 18px 10px; }
  .embed .eyebrow, .embed .subtitle, .embed .help { display: none; }
  .embed h1 { font-size: 1.13rem; }
  .embed .call-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 18px 14px; }
  .embed .call-status { min-width: 0; font-size: .84rem; }
  .embed .voice { grid-column: 1 / -1; }
  .embed #btn { width: auto; min-height: 42px; padding: 8px 12px; font-size: .86rem; }
  .embed .transcript { padding: 16px 18px; }
  .embed .transcript-header { margin-bottom: 10px; }
  .embed .transcript-hint { font-size: .78rem; }
  .embed #log { max-height: 52vh; }
  .embed #empty { padding: 30px 12px; }
</style>
</head>
<body>
<main class="app">
  <header class="intro">
    <p class="eyebrow">$eyebrow</p>
    <h1>$name</h1>
    <p class="subtitle">$subtitle</p>
  </header>
  <section id="call-panel" class="call-panel" data-state="ready">
    <div id="voice" class="voice" role="radiogroup" aria-label="$voice_label" data-default="$default_gender">
      <span class="voice-label">$voice_label</span>
      <div class="seg">
        <label><input id="voice-female" type="radio" name="gender" value="female"><span>$female</span></label>
        <label><input id="voice-male" type="radio" name="gender" value="male"><span>$male</span></label>
      </div>
    </div>
    <div class="call-status"><span class="status-dot" aria-hidden="true"></span><span id="status" aria-live="polite">$s_ready</span></div>
    <button id="btn" type="button" data-call="$call" data-hang-up="$hang_up">$call</button>
    <p class="help">$note</p>
  </section>
  <section class="transcript" aria-labelledby="transcript-title">
    <div class="transcript-header">
      <h2 id="transcript-title">$transcript_title</h2>
      <p class="transcript-hint">$transcript_hint</p>
    </div>
    <div class="transcript-frame">
      <div id="empty">$transcript_empty</div>
      <ol id="log" role="log" aria-live="off" aria-label="$transcript_title" data-you="$you" data-assistant="$assistant" hidden></ol>
      <button id="jump" type="button" hidden>$new_messages</button>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
const LK = window.LivekitClient;
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const panel = document.getElementById("call-panel");
const log = document.getElementById("log");
const empty = document.getElementById("empty");
const jump = document.getElementById("jump");
const timeFormat = new Intl.DateTimeFormat(document.documentElement.lang, { hour: "2-digit", minute: "2-digit" });
let room = null;
const lines = new Map();

function setStatus(message, state) {
  statusEl.textContent = message;
  panel.dataset.state = state;
}
const voiceInputs = [document.getElementById("voice-female"), document.getElementById("voice-male")].filter(Boolean);
const voiceDefault = document.getElementById("voice")?.dataset?.default || "female";
for (const input of voiceInputs) input.checked = input.value === voiceDefault;
function lockVoice(locked) { for (const input of voiceInputs) input.disabled = locked; }
function idle() {
  room = null;
  lockVoice(false);
  btn.textContent = btn.dataset.call;
  btn.className = "";
  btn.disabled = false;
}
function nearBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 48;
}
function show(segments, participant) {
  if (!room) return;
  const agent = !participant || participant.identity !== room.localParticipant.identity;
  const follow = nearBottom();
  for (const segment of segments) {
    const transcript = (segment.text || "").trim();
    if (!transcript) continue;
    let line = lines.get(segment.id);
    if (!line) {
      const item = document.createElement("li");
      item.className = agent ? "turn turn--agent" : "turn";
      const meta = document.createElement("div");
      meta.className = "turn-meta";
      const speaker = document.createElement("span");
      speaker.className = "turn-speaker";
      speaker.textContent = agent ? log.dataset.assistant : log.dataset.you;
      const time = document.createElement("time");
      const now = new Date();
      time.dateTime = now.toISOString();
      time.textContent = timeFormat.format(now);
      meta.append(speaker, time);
      const body = document.createElement("p");
      body.className = "turn-text";
      item.append(meta, body);
      log.appendChild(item);
      line = { item, body };
      lines.set(segment.id, line);
    }
    line.body.textContent = transcript;
    line.item.dataset.final = String(segment.final !== false);
    empty.hidden = true;
    log.hidden = false;
  }
  if (follow) log.scrollTop = log.scrollHeight;
  jump.hidden = nearBottom();
}
async function start() {
  btn.disabled = true;
  lockVoice(true);
  setStatus("$s_connecting", "connecting");
  log.replaceChildren();
  log.hidden = true;
  empty.hidden = false;
  jump.hidden = true;
  lines.clear();
  let activeRoom = null;
  const media = new Set();
  function cleanup() { for (const element of media) element.remove(); media.clear(); }
  try {
    const sessionPath = window.location.pathname.replace(/\/$$/, "") + "/session";
    const gender = voiceInputs.find((input) => input.checked)?.value || voiceDefault;
    const response = await fetch(sessionPath, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ gender }), signal: AbortSignal.timeout(15000),
    });
    if (!response.ok) {
      setStatus(response.status === 429 ? "$s_busy" : "$s_error", "error");
      idle();
      return;
    }
    const { url, token } = await response.json();
    activeRoom = new LK.Room();
    room = activeRoom;
    activeRoom.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "audio") {
        const element = track.attach();
        media.add(element);
        document.body.appendChild(element);
      }
    });
    activeRoom.on(LK.RoomEvent.TrackUnsubscribed, (track) => {
      for (const element of track.detach()) { element.remove(); media.delete(element); }
    });
    activeRoom.on(LK.RoomEvent.TranscriptionReceived, show);
    activeRoom.on(LK.RoomEvent.Disconnected, () => {
      cleanup();
      if (room === activeRoom) { setStatus("$s_ended", "ended"); idle(); }
    });
    await activeRoom.connect(url, token);
    await activeRoom.localParticipant.setMicrophoneEnabled(true);
    if (room !== activeRoom) return;
    setStatus("$s_live", "live");
    btn.textContent = btn.dataset.hangUp;
    btn.className = "end";
    btn.disabled = false;
  } catch (error) {
    console.error(error);
    if (activeRoom) await activeRoom.disconnect();
    cleanup();
    const microphoneError = error && ["NotAllowedError", "PermissionDeniedError", "NotFoundError"].includes(error.name);
    setStatus(microphoneError ? "$s_mic_error" : "$s_error", "error");
    idle();
  }
}

jump.addEventListener("click", () => { log.scrollTop = log.scrollHeight; jump.hidden = true; });
log.addEventListener("scroll", () => { jump.hidden = nearBottom(); });
btn.addEventListener("click", () => room ? room.disconnect() : start());
window.addEventListener("pagehide", () => { if (room) room.disconnect(); });
</script>
</body>
</html>
