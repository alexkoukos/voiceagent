name: PrankCaller
options:
  bundleIdPrefix: com.alekos
  deploymentTarget:
    iOS: "17.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
targets:
  PrankCaller:
    type: application
    platform: iOS
    sources: [PrankCaller]
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alekos.prankcaller
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Caller
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Για να μιλήσεις με πελάτες που ζητούν άνθρωπο."
